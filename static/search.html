
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>Search | UNREAL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --bg: #080b14;
      --panel: #101625;
      --border: #202b40;
      --blue: #4388ff;
      --text: #f3f6ff;
      --muted: #8c9ab3;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #14284c 0%, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    header {
      height: 76px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--blue);
    }

    .home {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .home:hover {
      color: white;
    }

    main {
      width: min(780px, 90%);
      margin: 100px auto 60px;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 68px);
      letter-spacing: -3px;
      line-height: 1.05;
      margin-bottom: 16px;
    }

    h1 span {
      color: var(--blue);
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 34px;
    }

    .search-form {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--border);
      background: rgba(16,22,37,.95);
      border-radius: 15px;
      box-shadow: 0 15px 50px rgba(0,0,0,.2);
    }

    .search-form:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(67,136,255,.12);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      background: transparent;
      border: 0;
      outline: none;
      color: white;
      font: inherit;
      font-size: 16px;
    }

    input::placeholder {
      color: #66748d;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 23px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover {
      background: #2e73ed;
      transform: translateY(-1px);
    }

    .info {
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .results {
      display: none;
      margin-top: 45px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .results h2 {
      font-size: 19px;
      margin-bottom: 10px;
    }

    .results p {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .results a {
      display: inline-block;
      margin-top: 18px;
      color: #8db7ff;
      text-decoration: none;
    }

    footer {
      text-align: center;
      color: #596780;
      font-size: 12px;
      padding: 30px 15px;
    }

    @media (max-width: 520px) {
      header {
        padding: 0 5%;
      }

      main {
        margin-top: 75px;
      }

      .search-form {
        flex-direction: column;
      }

      button {
        min-height: 48px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="/">UNREAL<span>.</span></a>
    <a class="home" href="/">Home</a>
  </header>

  <main>
    <p class="eyebrow">UNREAL SEARCH</p>

    <h1>Find your <span>next.</span></h1>

    <p class="subtitle">
      Search for websites, information, and things worth discovering.
    </p>

    <form class="search-form" id="searchForm" action="/search" method="GET">
      <input
        id="searchInput"
        type="search"
        name="q"
        placeholder="What are you looking for?"
        aria-label="Search query"
        autocomplete="off"
        required
      >

      <button type="submit">Search &rarr;</button>
    </form>

    <p class="info">Enter a search term to see results.</p>

    <section class="results" id="results" aria-live="polite">
      <h2 id="resultTitle">Search results</h2>
      <p>
        Your search is ready. Open the search provider to view the results.
      </p>
      <a id="resultLink" href="#">View search results &rarr;</a>
    </section>
  </main>

  <footer>UNREAL &copy; <span id="year"></span></footer>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const resultTitle = document.getElementById("resultTitle");
    const resultLink = document.getElementById("resultLink");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function showSearch(query) {
      const cleanQuery = query.trim();

      if (!cleanQuery) return;

      const url = new URL("https://www.google.com/search");
      url.searchParams.set("q", cleanQuery);

      resultTitle.textContent = `Results for "${cleanQuery}"`;
      resultLink.href = url.toString();
      results.style.display = "block";
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) return;

      const url = new URL("/search", window.location.origin);
      url.searchParams.set("q", query);

      window.location.href = url.toString();
    });

    const params = new URLSearchParams(window.location.search);
    const query = params.get("q");

    if (query) {
      input.value = query;
      showSearch(query);
    }
  </script>
</body>
</html>
