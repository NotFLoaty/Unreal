<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search | UNREAL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 35px 20px;
      background: #090b10;
      color: #f5f7fb;
      font-family: Arial, sans-serif;
    }
    header, main { max-width: 850px; margin: auto; }
    a { color: #85b6ff; text-decoration: none; }
    h1 { font-size: 32px; }
    h1 span { color: #438dff; }
    form {
      display: flex;
      gap: 10px;
      margin: 25px 0;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #28344a;
      border-radius: 10px;
      background: #10141e;
      color: white;
      font-size: 16px;
    }
    button {
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: #2678f5;
      color: white;
      cursor: pointer;
    }
    .note { color: #8992a4; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <a href="/"><strong>UNREAL<span>.</span></strong></a>
  </header>
  <main>
    <h1>Search<span>.</span></h1>
    <form action="https://www.google.com/search" method="get">
      <input name="q" type="search" placeholder="Search the web..." required>
      <button type="submit">Search</button>
    </form>
    <p class="note">Search the web from UNREAL.</p>
  </main>
</body>
</html>
